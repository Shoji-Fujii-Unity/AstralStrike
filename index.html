<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Astral Strike | 3D Shooter</title>
<style>
  :root {
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
    user-select: none;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
    touch-action: none;
  }
  .hidden { display: none !important; }
  .screen {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.76);
    overflow: auto;
    padding: 10px;
  }
  .menu {
    width: min(1000px, 96vw);
    max-height: 96vh;
    overflow: auto;
    background: linear-gradient(180deg, rgba(5,12,22,.97), rgba(3,5,10,.96));
    border: 1px solid #1c3a55;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 0 40px rgba(0,255,255,.08);
  }
  .title {
    font-size: clamp(26px, 5vw, 44px);
    font-weight: 900;
    letter-spacing: 0.08em;
    color: #7ef9ff;
    text-shadow: 0 0 18px rgba(0,255,255,.55);
  }
  .subtitle { opacity: .82; margin: 6px 0 16px; }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
  }
  button, select {
    appearance: none;
    border: 1px solid #396b8f;
    background: #0d2235;
    color: #fff;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { background: #143858; }
  button.primary {
    background: #0059aa;
    border-color: #36b5ff;
    font-weight: 800;
  }
  button.primary:hover { background: #0074d8; }
  button.danger {
    background: #6b1111;
    border-color: #ff6b6b;
  }
  button.danger:hover { background: #8f1b1b; }
  h2 { margin: 16px 0 8px; font-size: 20px; color: #8fdcff; }
  .controls {
    font-size: 13px;
    line-height: 1.5;
    opacity: .82;
    border: 1px solid #224;
    background: rgba(255,255,255,.04);
    border-radius: 10px;
    padding: 8px;
    margin-top: 8px;
  }
  .stageList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
  }
  .stageBtn {
    text-align: left;
    min-height: 92px;
    position: relative;
    overflow: hidden;
  }
  .stageBtn.locked {
    opacity: .45;
    cursor: not-allowed;
  }
  .stageName {
    font-weight: 800;
    margin-bottom: 6px;
  }
  .stageMeta {
    font-size: 12px;
    opacity: .8;
    margin-bottom: 4px;
  }
  .stageLock {
    position: absolute;
    right: 6px;
    top: 6px;
    font-size: 12px;
  }
  #rotateHint {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    font-size: 20px;
    text-align: center;
    padding: 20px;
    pointer-events: auto;
  }
  @media (orientation: portrait) {
    #rotateHint { display: flex; }
  }
  @media (orientation: landscape) {
    #rotateHint { display: none !important; }
  }
  #hud {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 10px;
    color: #fff;
    text-shadow: 0 1px 4px #000;
  }
  #pauseBtn { pointer-events: auto; }
  .hudTop {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .hudRight {
    text-align: right;
    min-width: 88px;
  }
  .hudBig {
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 4px;
  }
  .hudSmall { font-size: 12px; opacity: .85; }
  .bar {
    width: 240px;
    max-width: 42vw;
    height: 14px;
    background: #101;
    border: 1px solid #555;
    border-radius: 6px;
    overflow: hidden;
    margin-top: 4px;
  }
  #hpFill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #00ff88, #baff45);
  }
  .bossBar {
    width: min(640px, 82vw);
    margin: 0 auto;
  }
  #bossHpFill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ff4040, #ffd000);
  }
  .hudBottom {
    font-size: 12px;
    opacity: .7;
    text-align: center;
    padding: 6px;
  }
  #touchUI {
    position: fixed;
    inset: 0;
    z-index: 15;
    pointer-events: none;
  }
  .touchZone {
    position: fixed;
    bottom: 6%;
    width: 32vw;
    max-width: 220px;
    height: 32vw;
    max-height: 220px;
    border: 2px dashed rgba(255,255,255,.14);
    border-radius: 50%;
    color: rgba(255,255,255,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
  }
  .left { left: 5%; }
  .right { right: 5%; }
  .joyBase {
    position: fixed;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.28);
    background: rgba(255,255,255,.06);
  }
  .joyKnob {
    position: absolute;
    left: 35px;
    top: 35px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,.45);
  }
  .panel {
    width: min(520px, 94vw);
    background: rgba(5,10,20,.95);
    border: 1px solid #1c3a55;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
  }
  .bigText {
    font-size: 28px;
    font-weight: 900;
    margin: 8px 0;
    color: #8fdcff;
  }
  .scoreText { font-size: 15px; margin: 10px 0; }
  .btns {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 14px;
  }
  .footer { margin-top: 14px; font-size: 11px; opacity: .6; }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="rotateHint" data-i18n="rotate_hint"></div>

  <div id="touchUI" class="hidden">
    <div class="touchZone left"><span data-i18n="move_hint"></span></div>
    <div class="touchZone right"><span data-i18n="fire_hint"></span></div>
    <div id="moveBase" class="joyBase hidden"><div id="moveKnob" class="joyKnob"></div></div>
    <div id="aimBase" class="joyBase hidden"><div id="aimKnob" class="joyKnob"></div></div>
  </div>

  <div id="hud" class="hidden">
    <div class="hudTop">
      <div>
        <div id="stageInfo" class="hudBig"></div>
        <div id="waveInfo" class="hudSmall"></div>
        <div class="bar"><div id="hpFill"></div></div>
      </div>
      <div class="hudRight">
        <div id="scoreText" class="hudBig"></div>
        <button id="pauseBtn">⏸</button>
      </div>
    </div>

    <div id="bossBar" class="bossBar hidden">
      <div id="bossTitle" class="hudSmall"></div>
      <div class="bar"><div id="bossHpFill"></div></div>
    </div>

    <div class="hudBottom">
      <span id="controlsHint"></span>
    </div>
  </div>

  <div id="startScreen" class="screen">
    <div class="menu">
      <div class="title">Astral Strike</div>
      <div class="subtitle" data-i18n="tagline"></div>

      <div class="row">
        <span data-i18n="language"></span>
        <select id="langSelect"></select>
        <button id="soundBtn" data-i18n="sound_on"></button>
        <button id="startBtn" class="primary" data-i18n="start"></button>
      </div>

      <div id="controlsPC" class="controls"></div>
      <div id="controlsTouch" class="controls"></div>

      <h2 data-i18n="stage_select"></h2>
      <div id="stageList" class="stageList"></div>

      <div class="footer" data-i18n="save_note"></div>
    </div>
  </div>

  <div id="pauseScreen" class="screen hidden">
    <div class="panel">
      <div class="bigText" data-i18n="paused"></div>
      <div class="btns">
        <button id="resumeBtn" data-i18n="resume"></button>
        <button id="quitBtn1" data-i18n="quit"></button>
      </div>
    </div>
  </div>

  <div id="clearScreen" class="screen hidden">
    <div class="panel">
      <div id="clearTitle" class="bigText"></div>
      <div id="clearScore" class="scoreText"></div>
      <div id="clearUnlock" class="scoreText"></div>
      <div class="btns">
        <button id="nextBtn" class="primary" data-i18n="next"></button>
        <button id="retryBtnClear" data-i18n="retry"></button>
        <button id="quitBtn2" data-i18n="quit"></button>
      </div>
    </div>
  </div>

  <div id="gameOverScreen" class="screen hidden">
    <div class="panel">
      <div id="overTitle" class="bigText"></div>
      <div id="overScore" class="scoreText"></div>
      <div class="btns">
        <button id="retryBtnOver" data-i18n="retry"></button>
        <button id="quitBtn3" data-i18n="quit"></button>
      </div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

/* =======================
   Save / Settings
======================= */
const SAVE_KEY = 'astral_strike_v1';
let save = {
  unlocked: 1,
  highScores: {},
  lang: 'ja',
  sound: true
};

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    save.unlocked = Math.max(1, Math.min(20, Number(data.unlocked) || 1));
    save.highScores = data.highScores || {};
    if (typeof data.lang === 'string' && I18N[data.lang]) save.lang = data.lang;
    save.sound = data.sound !== false;
  } catch (e) {}
}

function saveNow() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  } catch (e) {}
}

}

/* =======================
   Stages
======================= */
const STAGES = [];

function parseWave(str) {
  return str.split(/\s+/).filter(Boolean).map((p) => {
    const parts = p.split(':').map(Number);
    return [parts[0], parts[1]];
  });
}

function addStage(id, boss, arena, bg, floor, waves) {
  STAGES.push({
    id, boss, arena, bg, floor,
    waves: waves.map(parseWave)
  });
}

/* =======================
   Boss definitions
======================= */
function FAN(n, spread, interval, delay, speed, damage) {
  return { type: 'fan', n, spread, interval, delay, speed, damage };
}
function RING(n, interval, delay, speed, damage) {
  return { type: 'ring', n, interval, delay, speed, damage };
}
function SPIRAL(duration, fireRate, interval, delay, speed, damage, angleSpeed) {
  return { type: 'spiral', duration, fireRate, interval, delay, speed, damage, angleSpeed };
}
function SPAWN(enemy, count, interval, delay) {
  return { type: 'spawn', enemy, count, interval, delay };
}
function CHARGE(interval, delay, duration, speed, damage) {
  return { type: 'charge', interval, delay, duration, speed, damage };
}
function TELEPORT(interval, delay) {
  return { type: 'teleport', interval, delay };
}

   Audio
======================= */
const sfx = {
  ctx: null,
  master: null,
  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.16;
    this.master.connect(this.ctx.destination);
  },
  can() {
    return !!save.sound && !!this.ctx && this.ctx.state === 'running';
  },
  tone(freq, dur, type, vol, slide) {
    if (!this.can()) return;
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(Math.max(20, freq), now);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), now + dur);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol * 0.5), now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(gain);
    gain.connect(this.master);
    osc.start(now);
    osc.stop(now + dur + 0.04);
  },
  noise(dur, vol) {
    if (!this.can()) return;
    const ctx = this.ctx;
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.value = vol * 0.55;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1400;
    src.connect(filter);
    filter.connect(gain);
    gain.connect(this.master);
    src.start();
  },
  shoot() { this.tone(880, 0.07, 'square', 0.16, -350); },
  hit() { this.tone(190, 0.05, 'sawtooth', 0.12, 90); },
  kill() { this.noise(0.18, 0.35); this.tone(120, 0.25, 'sine', 0.2, -50); },
  playerHit() { this.tone(110, 0.35, 'sawtooth', 0.5, -70); this.noise(0.25, 0.35); },
  bossWarn() { this.tone(70, 0.6, 'sawtooth', 0.4, 60); this.tone(45, 1.0, 'sine', 0.3, 20); },
  clear() {
    this.tone(440, 0.12, 'triangle', 0.35);
    setTimeout(() => this.tone(660, 0.12, 'triangle', 0.35), 120);
    setTimeout(() => this.tone(880, 0.25, 'triangle', 0.35), 240);
  },
  over() { this.tone(220, 0.6, 'sawtooth', 0.5, -150); }
};

/* =======================
   Utils
======================= */
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function rand(a, b) { return a + Math.random() * (b - a); }
function dist2D(ax, az, bx, bz) { return Math.hypot(ax - bx, az - bz); }

function tryLockLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
  } catch (e) {}
}

function disposeObject(obj) {
  if (!obj) return;
  if (obj.traverse) {
    obj.traverse((c) => {
      if (c.geometry) c.geometry.dispose();
      if (c.material) {
        if (Array.isArray(c.material)) c.material.forEach(m => m.dispose());
        else c.material.dispose();
      }
    });
  }
  if (obj.parent) obj.parent.remove(obj);
}

function getBulletMat(color) {
  const c = color || 0xff4444;
  if (!bulletMatCache.has(c)) {
    bulletMatCache.set(c, new THREE.MeshBasicMaterial({ color: c }));
  }
  return bulletMatCache.get(c);
}

  document.documentElement.lang = save.lang;
  document.title = t('title') + ' | 3D Shooter';

  document.querySelectorAll('[data-i18n]').forEach((node) => {
    node.textContent = t(node.getAttribute('data-i18n'));
  });

  el('soundBtn').textContent = save.sound ? t('sound_on') : t('sound_off');

  const langSelect = el('langSelect');
  langSelect.innerHTML = '';
  Object.keys(LANG_META).forEach((code) => {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = LANG_META[code];
    if (save.lang === code) opt.selected = true;
    langSelect.appendChild(opt);
  });

  buildStageList();
  updateControlsHint();
}

function updateControlsHint() {
  el('controlsPC').textContent = t('controls_pc');
  el('controlsTouch').textContent = t('controls_touch');
  el('controlsHint').textContent = isTouch ? t('controls_touch') : t('controls_pc');
}

function buildStageList() {
  const list = el('stageList');
  list.innerHTML = '';

  STAGES.forEach((st, i) => {
    const unlocked = i < save.unlocked;
    const btn = document.createElement('button');
    btn.className = 'stageBtn' + (unlocked ? '' : ' locked');
    if (!unlocked) btn.disabled = true;

    const stageNo = document.createElement('div');
    stageNo.className = 'stageName';
    stageNo.textContent = `${t('stage')} ${i + 1}: ${stageNameById(st.id)}`;
    btn.appendChild(stageNo);

    const meta = document.createElement('div');
    meta.className = 'stageMeta';
    meta.textContent = `${t('boss')}: ${bossNameById(st.boss)}`;
    btn.appendChild(meta);

    const high = save.highScores[i + 1] || 0;
    const hs = document.createElement('div');
    hs.className = 'stageMeta';
    hs.textContent = high ? `${t('high_score')}: ${high}` : '';
    btn.appendChild(hs);

    if (!unlocked) {
      const lock = document.createElement('div');
      lock.className = 'stageLock';
      lock.textContent = '🔒 ' + t('locked');
      btn.appendChild(lock);
    } else {
      btn.onclick = () => {
        sfx.init();
        tryLockLandscape();
        startStage(i);
      };
    }

    list.appendChild(btn);
  });
}

function showScreen(name) {
  ['startScreen', 'pauseScreen', 'clearScreen', 'gameOverScreen'].forEach((id) => {
    const e = el(id);
    if (e) e.classList.add('hidden');
  });
  if (name) el(name).classList.remove('hidden');
}

function setHud(show) {
  el('hud').classList.toggle('hidden', !show);
  el('touchUI').classList.toggle('hidden', !(show && isTouch));
}

function updateHud() {
  if (!player) return;

  if (stageConfig && currentStageIndex >= 0) {
    el('stageInfo').textContent = `${t('stage')} ${currentStageIndex + 1}: ${stageNameById(currentStageIndex + 1)}`;
    if (bossActive) {
      el('waveInfo').textContent = t('boss_warning');
    } else {
      const total = stageConfig.waves.length || 1;
      el('waveInfo').textContent = `${t('wave')} ${Math.min(waveIndex + 1, total)}/${total}`;
    }
  }

  el('hpFill').style.width = `${clamp(player.hp / player.maxHp * 100, 0, 100)}%`;
  el('scoreText').textContent = `${t('score')} ${score}`;

  const bossBar = el('bossBar');
  if (boss) {
    bossBar.classList.remove('hidden');
    el('bossTitle').textContent = `${t('boss')}: ${bossNameById(stageConfig.boss)}`;
    el('bossHpFill').style.width = `${clamp(boss.hp / boss.maxHp * 100, 0, 100)}%`;
  } else {
    bossBar.classList.add('hidden');
  }
}

function submitScore() {
  if (currentStageIndex < 0) return;
  const key = currentStageIndex + 1;
  const prev = save.highScores[key] || 0;
  if (score > prev) save.highScores[key] = score;
  saveNow();
  buildStageList();
}

function showGameOver() {
  const high = save.highScores[currentStageIndex + 1] || 0;
  el('overTitle').textContent = t('game_over');
  el('overScore').textContent = `${t('score')}: ${score}${high ? ` | ${t('high_score')}: ${high}` : ''}`;
  showScreen('gameOverScreen');
}

function showClear(newlyUnlocked) {
  const high = save.highScores[currentStageIndex + 1] || 0;
  el('clearTitle').textContent = t('stage_clear');
  el('clearScore').textContent = `${t('score')}: ${score}${high ? ` | ${t('high_score')}: ${high}` : ''}`;
  if (currentStageIndex >= STAGES.length - 1) {
    el('clearUnlock').textContent = t('stage_complete');
  } else {
    el('clearUnlock').textContent = newlyUnlocked ? t('next_stage_unlocked') : '';
  }
  el('nextBtn').classList.toggle('hidden', currentStageIndex >= STAGES.length - 1);
  showScreen('clearScreen');
}

/* =======================
   Input
======================= */
function initInput() {
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    const k = (e.key || '').toLowerCase();

    if (k === 'escape' || k === 'p') {
      togglePause();
      return;
    }

    if (state !== 'playing') return;

    if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) {
      keys[k] = true;
      if (k.startsWith('arrow')) e.preventDefault();
    }
    if (k === ' ' || e.code === 'Space') {
      fireInput = true;
      e.preventDefault();
    }
  });

  window.addEventListener('keyup', (e) => {
    const k = (e.key || '').toLowerCase();
    if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) keys[k] = false;
    if (k === ' ' || e.code === 'Space') fireInput = false;
  });

  canvasEl.addEventListener('pointerdown', (e) => {
    if (state !== 'playing') return;
    if (e.pointerType !== 'mouse') e.preventDefault();

    if (e.pointerType === 'mouse') {
      fireInput = true;
      updateMouseAim(e);
    } else {
      if (e.clientX < window.innerWidth * 0.45) {
        pointerMove = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY };
        showJoy('move', pointerMove.ox, pointerMove.oy);
      } else {
        pointerAim = { id: e.pointerId, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY };
        showJoy('aim', pointerAim.ox, pointerAim.oy);
      }
    }
  }, { passive: false });

  canvasEl.addEventListener('pointermove', (e) => {
    if (state !== 'playing') return;

    if (e.pointerType === 'mouse') {
      updateMouseAim(e);
      return;
    }

    if (pointerMove && e.pointerId === pointerMove.id) {
      pointerMove.x = e.clientX;
      pointerMove.y = e.clientY;
      moveJoy('move', pointerMove);
    }
    if (pointerAim && e.pointerId === pointerAim.id) {
      pointerAim.x = e.clientX;
      pointerAim.y = e.clientY;
      moveJoy('aim', pointerAim);
    }
  });

  function endPointer(e) {
    if (e.pointerType === 'mouse') {
      fireInput = false;
    }
    if (pointerMove && e.pointerId === pointerMove.id) {
      pointerMove = null;
      hideJoy('move');
    }
    if (pointerAim && e.pointerId === pointerAim.id) {
      pointerAim = null;
      touchAim.active = false;
      hideJoy('aim');
    }
  }

  canvasEl.addEventListener('pointerup', endPointer);
  canvasEl.addEventListener('pointercancel', endPointer);
  canvasEl.addEventListener('contextmenu', (e) => e.preventDefault());
}

function updateMouseAim(e) {
  if (!camera) return;
  const r = canvasEl.getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width) * 2 - 1;
  const y = -(((e.clientY - r.top) / r.height) * 2 - 1);
  mouseNDC.set(x, y);
  mouseAimActive = true;

  raycaster.setFromCamera(mouseNDC, camera);
  raycaster.ray.intersectPlane(aimPlane, aimPoint);
}

function showJoy(type, x, y) {
  const base = el(type === 'move' ? 'moveBase' : 'aimBase');
  if (!base) return;
  base.classList.remove('hidden');
  base.style.left = (x - 50) + 'px';
  base.style.top = (y - 50) + 'px';
  const knob = el(type === 'move' ? 'moveKnob' : 'aimKnob');
  if (knob) knob.style.transform = 'translate(0px, 0px)';
}

function moveJoy(type, p) {
  const knob = el(type === 'move' ? 'moveKnob' : 'aimKnob');
  if (!knob) return;
  let dx = p.x - p.ox;
  let dy = p.y - p.oy;
  dx = clamp(dx, -50, 50);
  dy = clamp(dy, -50, 50);
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
}

function hideJoy(type) {
  const base = el(type === 'move' ? 'moveBase' : 'aimBase');
  if (base) base.classList.add('hidden');
}

/* =======================
   World / Entities
======================= */
function makeGeo(geo, radius) {
  switch (geo) {
    case 'tetra': return new THREE.TetrahedronGeometry(radius);
    case 'cone': return new THREE.ConeGeometry(radius * 0.8, radius * 1.8, 7);
    case 'box': return new THREE.BoxGeometry(radius * 1.4, radius * 1.4, radius * 1.4);
    case 'cyl': return new THREE.CylinderGeometry(radius * 0.8, radius, radius * 1.6, 8);
    case 'dodeca': return new THREE.DodecahedronGeometry(radius);
    case 'icosa': return new THREE.IcosahedronGeometry(radius);
    case 'sphere': return new THREE.SphereGeometry(radius, 14, 10);
    case 'octa': return new THREE.OctahedronGeometry(radius);
    case 'torus': return new THREE.TorusGeometry(radius, radius * 0.35, 8, 16);
    default: return new THREE.OctahedronGeometry(radius);
  }
}

function clearWorld() {
  if (!scene) return;
  for (let i = scene.children.length - 1; i >= 0; i--) {
    const c = scene.children[i];
    if (c.isLight) continue;
    scene.remove(c);
    disposeObject(c);
  }
  scene.fog = null;
  scene.background = null;
}

function setupWorld(st) {
  clearWorld();

  scene.background = new THREE.Color(st.bg);
  scene.fog = new THREE.Fog(st.bg, 18, st.arena * 2.4);

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(st.arena * 2, st.arena * 2),
    new THREE.MeshStandardMaterial({ color: st.floor, roughness: 1, metalness: 0 })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  const div = Math.max(8, Math.floor(st.arena / 5));
  const grid = new THREE.GridHelper(st.arena * 2, div, 0x22ffff, 0x074060);
  grid.position.y = 0.02;
  scene.add(grid);

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(st.arena * 2, 1.8, st.arena * 2)),
    new THREE.LineBasicMaterial({ color: 0x22aaff, transparent: true, opacity: 0.45 })
  );
  edges.position.y = 0.9;
  scene.add(edges);
}

function setupPlayer() {
  const group = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.ConeGeometry(0.8, 2.2, 8),
    new THREE.MeshStandardMaterial({
      color: 0x00e5ff,
      emissive: 0x004455,
      emissiveIntensity: 0.55,
      metalness: 0.45,
      roughness: 0.35
    })
  );
  body.rotation.x = Math.PI / 2;
  body.position.y = 1.1;
  group.add(body);

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.0, 0.08, 6, 18),
    new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.65 })
  );
  ring.rotation.x = Math.PI / 2;
  ring.position.y = 0.55;
  group.add(ring);

  scene.add(group);

  player = {
    mesh: group,
    hp: 100,
    maxHp: 100,
    radius: 1.0,
    fireCd: 0,
    inv: 0,
    yaw: 0,
    aimDir: new THREE.Vector3(0, 0, 1)
  };

  group.position.set(0, 0, 0);
  camera.position.set(0, 22, 28);
  camera.lookAt(0, 1, 0);
}

function clampArena(pos) {
  if (!stageConfig) return;
  const a = stageConfig.arena - 1.2;
  pos.x = clamp(pos.x, -a, a);
  pos.z = clamp(pos.z, -a, a);
}

function spawnPosition(minD, maxD) {
  const p = new THREE.Vector3(0, 1, 0);
  const pp = player.mesh.position;
  for (let i = 0; i < 25; i++) {
    const ang = Math.random() * Math.PI * 2;
    const d = rand(minD, maxD);
    p.set(pp.x + Math.cos(ang) * d, 1, pp.z + Math.sin(ang) * d);
    clampArena(p);
    if (dist2D(pp.x, pp.z, p.x, p.z) > 14) break;
  }
  return p;
}

function enemyLimit() {
  if (!stageConfig) return 25;
  return Math.min(35, 12 + stageConfig.id * 2);
}

function spawnEnemy(type, pos) {
  if (!stageConfig || enemies.length >= enemyLimit()) return;
  const def = ENEMY_DEFS[type];
  if (!def) return;

  const diff = 1 + (stageConfig.id - 1) * 0.18;
  const speedDiff = 1 + (stageConfig.id - 1) * 0.035;

  const mesh = new THREE.Mesh(
    makeGeo(def.geo, def.radius),
    new THREE.MeshStandardMaterial({
      color: def.color,
      emissive: def.color,
      emissiveIntensity: 0.3,
      metalness: 0.25,
      roughness: 0.55
    })
  );
  mesh.position.copy(pos);
  scene.add(mesh);

  enemies.push({
    def,
    mesh,
    hp: def.hp * diff,
    speed: def.speed * speedDiff,
    angle: Math.random() * Math.PI * 2,
    shootTimer: Math.random() * 1.2,
    flash: 0
  });
}

function addPlayerBullet(x, z, angle, speed, damage) {
  if (bullets.length > 260) return;
  const mesh = new THREE.Mesh(bulletGeo, playerBulletMat);
  mesh.position.set(x, 1, z);
  scene.add(mesh);
  bullets.push({
    mesh,
    vx: Math.cos(angle) * speed,
    vz: Math.sin(angle) * speed,
    life: 3.0,
    dmg: damage
  });
}

function addEnemyBullet(x, z, angle, speed, damage, color) {
  if (enemyBullets.length > 420) return;
  const mesh = new THREE.Mesh(bulletGeo, getBulletMat(color));
  mesh.position.set(x, 1, z);
  scene.add(mesh);
  enemyBullets.push({
    mesh,
    vx: Math.cos(angle) * speed,
    vz: Math.sin(angle) * speed,
    life: 5.0,
    dmg: damage
  });
}

function fireBulletFan(pos, baseAngle, count, spread, speed, damage, color) {
  const n = Math.max(1, count || 1);
  for (let i = 0; i < n; i++) {
    let angle = baseAngle;
    if (n > 1) {
      angle = baseAngle + spread * (i - (n - 1) / 2) / (n - 1);
    }
    addEnemyBullet(pos.x, pos.z, angle, speed, damage, color);
  }
}

function addExplosion(pos, color, size) {
  if (particles.length > 70) return;
  const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.9 });
  const mesh = new THREE.Mesh(bulletGeo, mat);
  mesh.position.set(pos.x, 1, pos.z);
  mesh.scale.setScalar(0.1);
  scene.add(mesh);
  particles.push({ mesh, mat, life: 0.45, max: 0.45, scale: size || 1 });
}

function removeEnemy(index) {
  const e = enemies[index];
  if (!e) return;

  if (e.def.id === 4) {
    for (let k = 0; k < 2; k++) {
      const a = Math.random() * Math.PI * 2;
      const p = new THREE.Vector3(e.mesh.position.x + Math.cos(a) * 2.5, 1, e.mesh.position.z + Math.sin(a) * 2.5);
      clampArena(p);
      spawnEnemy(0, p);
    }
  }

  addExplosion(e.mesh.position, e.def.color, 1.0);
  scene.remove(e.mesh);
  disposeObject(e.mesh);
  enemies.splice(index, 1);

  score += e.def.score;
  sfx.kill();
}

function damageEnemy(index, dmg) {
  const e = enemies[index];
  if (!e) return;
  e.hp -= dmg;
  e.flash = 0.12;
  if (e.hp <= 0) removeEnemy(index);
}

function damagePlayer(dmg) {
  if (!player || player.inv > 0) return;
  player.hp -= dmg;
  player.inv = 0.75;
  sfx.playerHit();
  if (player.hp <= 0) gameOver();
}

function getPlayerDamage() {
  return 8 + (stageConfig ? stageConfig.id * 0.75 : 0);
}

function enemyShoot(e) {
  const shoot = e.def.shoot;
  if (!shoot) return;
  const pp = player.mesh.position;
  const pos = e.mesh.position;
  const angle = Math.atan2(pp.z - pos.z, pp.x - pos.x);
  const count = shoot.count || 1;
  if (count > 1) {
    fireBulletFan(pos, angle, count, shoot.spread || 0.5, shoot.speed, shoot.damage, e.def.color);
  } else {
    addEnemyBullet(pos.x, pos.z, angle, shoot.speed, shoot.damage, e.def.color);
  }
  e.shootTimer = shoot.interval;
}

/* =======================
   Boss
======================= */
function createBossMesh(def) {
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({
    color: def.color,
    emissive: def.color,
    emissiveIntensity: 0.45,
    metalness: 0.55,
    roughness: 0.25
  });

  const core = new THREE.Mesh(makeGeo(def.geo, def.radius), mat);
  group.add(core);

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(def.radius * 1.35, def.radius * 0.13, 10, 36),
    mat
  );
  ring.rotation.x = Math.PI / 2;
  group.add(ring);

  return group;
}

function startBoss() {
  if (!stageConfig || bossActive) return;
  const def = BOSS_DEFS[stageConfig.boss];
  if (!def) return;

  const pos = spawnPosition(28, 38);
  pos.y = Math.max(1.5, def.radius * 0.55);

  const mesh = createBossMesh(def);
  mesh.position.copy(pos);
  scene.add(mesh);

  boss = {
    def,
    hp: def.hp,
    maxHp: def.hp,
    mesh,
    orbitAngle: Math.random() * Math.PI * 2,
    charge: null,
    spiral: null,
    attacks: def.attacks.map((a) => ({ ...a, timer: a.delay != null ? a.delay : 1 }))
  };

  bossActive = true;
  sfx.bossWarn();
  updateHud();
}

function killBoss() {
  if (!boss) return;
  for (let i = 0; i < 6; i++) {
    addExplosion(boss.mesh.position, boss.def.color, 2.2 + Math.random() * 2.5);
  }
  score += boss.def.score;
  scene.remove(boss.mesh);
  disposeObject(boss.mesh);
  boss = null;
  bossActive = false;
  clearStage();
}

function updateBoss(dt) {
  if (!boss) return;

  if (boss.hp <= 0) {
    killBoss();
    return;
  }

  const pp = player.mesh.position;
  const pos = boss.mesh.position;

  if (boss.charge && boss.charge.timer > 0) {
    pos.x += boss.charge.vx * dt;
    pos.z += boss.charge.vz * dt;
    boss.charge.timer -= dt;
    if (boss.charge.timer <= 0) boss.charge = null;
  } else {
    const desired = boss.def.distance || 18;
    boss.orbitAngle += dt * 0.42;
    const target = new THREE.Vector3(
      pp.x + Math.cos(boss.orbitAngle) * desired,
      pos.y,
      pp.z + Math.sin(boss.orbitAngle) * desired
    );
    const dx = target.x - pos.x;
    const dz = target.z - pos.z;
    const len = Math.hypot(dx, dz);
    const speed = boss.def.speed * (boss.hp / boss.maxHp < 0.5 ? 1.15 : 1.0);
    if (len > 0.1) {
      pos.x += (dx / len) * speed * dt;
      pos.z += (dz / len) * speed * dt;
    }
  }

  clampArena(pos);
  boss.mesh.rotation.y += dt * 0.35;

  if (boss.spiral && boss.spiral.timer > 0) {
    boss.spiral.spawnTimer -= dt;
    if (boss.spiral.spawnTimer <= 0) {
      addEnemyBullet(pos.x, pos.z, boss.spiral.angle, boss.spiral.speed, boss.spiral.dmg, boss.def.bulletColor);
      boss.spiral.angle += boss.spiral.angleSpeed;
      boss.spiral.spawnTimer = boss.spiral.fireRate;
    }
    boss.spiral.timer -= dt;
    if (boss.spiral.timer <= 0) boss.spiral = null;
  }

  for (const at of boss.attacks) {
    at.timer -= dt;
    if (at.timer > 0) continue;

    const angleToPlayer = Math.atan2(pp.z - pos.z, pp.x - pos.x);

    if (at.type === 'fan') {
      fireBulletFan(pos, angleToPlayer, at.n, at.spread, at.speed, at.damage, boss.def.bulletColor);
    } else if (at.type === 'ring') {
      fireBulletFan(pos, Math.random() * Math.PI * 2, at.n, Math.PI * 2, at.speed, at.damage, boss.def.bulletColor);
    } else if (at.type === 'spiral') {
      boss.spiral = {
        timer: at.duration,
        spawnTimer: 0,
        angle: Math.random() * Math.PI * 2,
        fireRate: at.fireRate,
        speed: at.speed,
        dmg: at.damage,
        angleSpeed: at.angleSpeed
      };
    } else if (at.type === 'spawn') {
      for (let i = 0; i < at.count; i++) {
        const a = Math.random() * Math.PI * 2;
        const p = new THREE.Vector3(
          pos.x + Math.cos(a) * (boss.def.radius + 3),
          1,
          pos.z + Math.sin(a) * (boss.def.radius + 3)
        );
        clampArena(p);
        spawnEnemy(at.enemy, p);
      }
    } else if (at.type === 'charge') {
      if (!boss.charge) {
        boss.charge = {
          timer: at.duration,
          vx: Math.cos(angleToPlayer) * at.speed,
          vz: Math.sin(angleToPlayer) * at.speed,
          dmg: at.damage
        };
      }
    } else if (at.type === 'teleport') {
      const a = stageConfig.arena - 5;
      const np = new THREE.Vector3(rand(-a, a), pos.y, rand(-a, a));
      addExplosion(pos, boss.def.color, 2.0);
      pos.copy(np);
      addExplosion(pos, boss.def.color, 2.0);
      sfx.noise(0.2, 0.4);
    }

    at.timer = at.interval || 4.0;
  }

  if (dist2D(pp.x, pp.z, pos.x, pos.z) < boss.def.radius + player.radius + 0.4) {
    damagePlayer(boss.def.contact * (boss.hp / boss.maxHp < 0.5 ? 1.15 : 1.0));
  }
}

/* =======================
   Stage flow
======================= */
function clearEntities() {
  for (const e of enemies) {
    if (e.mesh.parent) e.mesh.parent.remove(e.mesh);
    disposeObject(e.mesh);
  }
  enemies.length = 0;

  for (const b of bullets) {
    if (b.mesh.parent) b.mesh.parent.remove(b.mesh);
  }
  bullets.length = 0;

  for (const b of enemyBullets) {
    if (b.mesh.parent) b.mesh.parent.remove(b.mesh);
  }
  enemyBullets.length = 0;

  for (const p of particles) {
    if (p.mesh.parent) p.mesh.parent.remove(p.mesh);
    if (p.mesh.material) p.mesh.material.dispose();
  }
  particles.length = 0;

  if (boss) {
    if (boss.mesh.parent) boss.mesh.parent.remove(boss.mesh);
    disposeObject(boss.mesh);
    boss = null;
  }
  if (player && player.mesh) {
    if (player.mesh.parent) player.mesh.parent.remove(player.mesh);
    disposeObject(player.mesh);
  }
}

function loadWave(idx) {
  if (!stageConfig) return;
  waveIndex = idx;
  waveClearTimer = 0;
  spawnQueue = [];

  if (idx >= stageConfig.waves.length) {
    startBoss();
    return;
  }

  const waves = stageConfig.waves[idx];
  for (const pair of waves) {
    for (let i = 0; i < pair[1]; i++) spawnQueue.push(pair[0]);
  }

  for (let i = spawnQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = spawnQueue[i];
    spawnQueue[i] = spawnQueue[j];
    spawnQueue[j] = tmp;
  }

  spawnTimer = 0.9;
  updateHud();
}

function startStage(idx) {
  if (!scene) return;
  idx = Math.max(0, Math.min(STAGES.length - 1, idx));

  currentStageIndex = idx;
  stageConfig = STAGES[idx];
  score = 0;
  waveIndex = 0;
  spawnQueue = [];
  waveClearTimer = 0;
  bossActive = false;

  pointerMove = null;
  pointerAim = null;
  touchAim.active = false;
  fireInput = false;
  keys = {};
  mouseAimActive = false;

  clearEntities();
  setupWorld(stageConfig);
  setupPlayer();

  state = 'playing';
  showScreen(null);
  setHud(true);
  loadWave(0);
  updateHud();
}

function checkWaves(dt) {
  if (!stageConfig || bossActive) return;

  if (spawnQueue.length > 0 && enemies.length < enemyLimit()) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const type = spawnQueue.shift();
      spawnEnemy(type, spawnPosition(30, 46));
      spawnTimer = Math.max(0.32, 1.1 - stageConfig.id * 0.045);
    }
  }

  if (spawnQueue.length === 0 && enemies.length === 0) {
    if (waveClearTimer <= 0) {
      waveClearTimer = 1.2;
      return;
    }
    waveClearTimer -= dt;
    if (waveClearTimer <= 0) {
      loadWave(waveIndex + 1);
    }
  }
}

function gameOver() {
  if (state === 'gameover') return;
  state = 'gameover';
  submitScore();
  addExplosion(player.mesh.position, 0x00ffff, 3.5);
  sfx.over();
  setHud(false);
  showGameOver();
}

function clearStage() {
  const before = save.unlocked;
  save.unlocked = Math.max(save.unlocked, currentStageIndex + 2);
  save.unlocked = Math.min(STAGES.length, save.unlocked);
  submitScore();
  const newly = before < save.unlocked;
  setHud(false);
  sfx.clear();
  showClear(newly);
  state = 'clear';
}

function togglePause() {
  if (state === 'playing') {
    state = 'paused';
    setHud(false);
    showScreen('pauseScreen');
  } else if (state === 'paused') {
    state = 'playing';
    setHud(true);
    showScreen(null);
  }
}

/* =======================
   Update
======================= */
function updatePlayer(dt) {
  if (!player || !player.mesh) return;

  player.fireCd -= dt;
  if (player.inv > 0) player.inv -= dt;

  let mx = 0;
  let my = 0;

  if (keys['w'] || keys['arrowup']) my += 1;
  if (keys['s'] || keys['arrowdown']) my -= 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;

  if (pointerMove) {
    mx += (pointerMove.x - pointerMove.ox) / 50;
    my -= (pointerMove.y - pointerMove.oy) / 50;
  }

  const len = Math.hypot(mx, my);
  if (len > 1) {
    mx /= len;
    my /= len;
  }

  const pp = player.mesh.position;
  const speed = 11.5 + Math.min(3.0, (stageConfig ? stageConfig.id * 0.08 : 0));
  pp.x += mx * speed * dt;
  pp.z -= my * speed * dt;
  clampArena(pp);
  pp.y = 0;

  if (mouseAimActive) {
    raycaster.setFromCamera(mouseNDC, camera);
    raycaster.ray.intersectPlane(aimPlane, aimPoint);
  }

  let aimDir = null;
  if (mouseAimActive) {
    const d = new THREE.Vector3(aimPoint.x - pp.x, 0, aimPoint.z - pp.z);
    if (d.lengthSq() > 0.05) aimDir = d.normalize();
  }

  if (pointerAim) {
    const dx = pointerAim.x - pointerAim.ox;
    const dy = pointerAim.y - pointerAim.oy;
    const l = Math.hypot(dx, dy);
    if (l > 6) {
      touchAim.x = dx / l;
      touchAim.y = dy / l;
      touchAim.active = true;
      const d = new THREE.Vector3(touchAim.x, 0, touchAim.y);
      if (d.lengthSq() > 0.05) aimDir = d.normalize();
    } else {
      touchAim.active = false;
    }
  } else {
    touchAim.active = false;
  }

  if (aimDir) {
    player.aimDir.copy(aimDir);
    player.yaw = Math.atan2(aimDir.x, aimDir.z);
    player.mesh.rotation.y = player.yaw;
  }

  const firing = fireInput || !!pointerAim;
  if (firing && player.fireCd <= 0) {
    const dir = player.aimDir;
    const angle = Math.atan2(dir.z, dir.x);
    addPlayerBullet(pp.x, pp.z, angle, 58, getPlayerDamage());
    player.fireCd = 0.12;
    sfx.shoot();
  }

  const camTarget = new THREE.Vector3(pp.x, 22, pp.z + 28);
  camera.position.lerp(camTarget, Math.min(1, dt * 10));
  camera.lookAt(camera.position.x, 1, camera.position.z - 28);
}

function updateEnemies(dt) {
  const pp = player.mesh.position;

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (!e || !e.mesh) continue;

    if (e.flash > 0) {
      e.flash -= dt;
      e.mesh.material.emissiveIntensity = 1.6;
    } else {
      e.mesh.material.emissiveIntensity = 0.3;
    }

    const pos = e.mesh.position;
    const dx = pp.x - pos.x;
    const dz = pp.z - pos.z;
    const dist = Math.hypot(dx, dz);

    if (dist < e.def.radius + player.radius + 0.2) {
      damagePlayer(e.def.contact);
      removeEnemy(i);
      continue;
    }

    let vx = 0;
    let vz = 0;

    if (e.def.id === 2 || e.def.id === 3) {
      const desired = e.def.id === 2 ? 18 : 13;
      if (dist > desired + 2) {
        vx = (dx / (dist || 1)) * e.speed;
        vz = (dz / (dist || 1)) * e.speed;
      } else if (dist < desired - 2) {
        vx = (-dx / (dist || 1)) * e.speed;
        vz = (-dz / (dist || 1)) * e.speed;
      }
    } else if (e.def.id === 9) {
      e.angle += dt * 0.75;
      const tx = pp.x + Math.cos(e.angle) * 14;
      const tz = pp.z + Math.sin(e.angle) * 14;
      const ox = tx - pos.x;
      const oz = tz - pos.z;
      const l = Math.hypot(ox, oz);
      if (l > 0.1) {
        vx = (ox / l) * e.speed;
        vz = (oz / l) * e.speed;
      }
    } else if (e.def.id === 8) {
      const vis = Math.sin(performance.now() * 0.002 + e.angle) > -0.25;
      e.mesh.visible = vis;
      if (e.def.speed > 0 && dist > 0) {
        vx = (dx / dist) * e.speed;
        vz = (dz / dist) * e.speed;
      }
    } else {
      if (e.def.speed > 0 && dist > 0) {
        vx = (dx / dist) * e.speed;
        vz = (dz / dist) * e.speed;
      }
    }

    pos.x += vx * dt;
    pos.z += vz * dt;
    clampArena(pos);

    if (e.def.shoot && dist < 55) {
      e.shootTimer -= dt;
      if (e.shootTimer <= 0) {
        enemyShoot(e);
        e.shootTimer = e.def.shoot.interval;
      }
    }
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    b.mesh.position.x += b.vx * dt;
    b.mesh.position.z += b.vz * dt;

    let remove = b.life <= 0 || outOfArena(b.mesh.position, 12);

    if (!remove) {
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        const d = dist2D(b.mesh.position.x, b.mesh.position.z, e.mesh.position.x, e.mesh.position.z);
        if (d < e.def.radius + 0.25) {
          damageEnemy(j, b.dmg);
          sfx.hit();
          remove = true;
          break;
        }
      }
    }

    if (!remove && boss) {
      const d = dist2D(b.mesh.position.x, b.mesh.position.z, boss.mesh.position.x, boss.mesh.position.z);
      if (d < boss.def.radius + 0.35) {
        boss.hp -= b.dmg;
        sfx.hit();
        remove = true;
      }
    }

    if (remove) {
      if (b.mesh.parent) b.mesh.parent.remove(b.mesh);
      bullets.splice(i, 1);
    }
  }
}

function updateEnemyBullets(dt) {
  const pp = player.mesh.position;

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.life -= dt;
    b.mesh.position.x += b.vx * dt;
    b.mesh.position.z += b.vz * dt;

    let remove = b.life <= 0 || outOfArena(b.mesh.position, 12);

    if (!remove) {
      const d = dist2D(b.mesh.position.x, b.mesh.position.z, pp.x, pp.z);
      if (d < player.radius + 0.35) {
        damagePlayer(b.dmg);
        remove = true;
      }
    }

    if (remove) {
      if (b.mesh.parent) b.mesh.parent.remove(b.mesh);
      enemyBullets.splice(i, 1);
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      if (p.mesh.parent) p.mesh.parent.remove(p.mesh);
      if (p.mesh.material) p.mesh.material.dispose();
      particles.splice(i, 1);
      continue;
    }
    const k = 1 - p.life / p.max;
    p.mesh.scale.setScalar(Math.max(0.05, 0.1 + k * p.scale * 3));
    p.mesh.material.opacity = p.life / p.max;
  }
}

function outOfArena(pos, margin) {
  if (!stageConfig) return false;
  const a = stageConfig.arena + margin;
  return pos.x < -a || pos.x > a || pos.z < -a || pos.z > a;
}

function update(dt) {
  if (state !== 'playing') return;
  updatePlayer(dt);
  updateEnemies(dt);
  updateBullets(dt);
  updateEnemyBullets(dt);
  updateParticles(dt);
  updateBoss(dt);
  checkWaves(dt);
  updateHud();
}

/* =======================
   Render loop
======================= */
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.033, clock.getDelta());
  update(dt);
  if (renderer && scene && camera) renderer.render(scene, camera);
}

function initThree() {
  canvasEl = el('game');
  renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 600);
  camera.position.set(0, 16, 20);
  camera.lookAt(0, 0, 0);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 0.75));
  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(10, 30, 10);
  scene.add(dir);

  raycaster = new THREE.Raycaster();
  aimPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

  bulletGeo = new THREE.SphereGeometry(0.18, 8, 8);
  playerBulletMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });

  clock = new THREE.Clock();

  window.addEventListener('resize', () => {
    if (!camera || !renderer) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') togglePause();
  });

  initInput();
  animate();
}

/* =======================
   Main
======================= */
function main() {
  if (typeof THREE === 'undefined') {
    const menu = document.querySelector('#startScreen .menu');
    if (menu) {
      menu.innerHTML = '<h1>Three.js の読み込みに失敗しました。</h1><p>ネットワーク接続を確認してください。</p>';
    }
    return;
  }

  loadSave();
  applyI18n();
  initThree();
  bindUI();
}

main();
})();
</script>
